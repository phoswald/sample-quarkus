{@com.github.phoswald.sample.task.TaskViewModel task}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Task Details</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="../../../">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../tasks">Tasks</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="">Details</a>
            </li>
          </ul>
        </div>  
      </div>
    </nav>
    <div class="container" style="max-width: 960px">
      <h2 class="my-4">Task Details</h2>
      <p>
        <a class="btn btn-secondary btn-sm" href="?action=edit">Edit</a>
      </p>
      <table class="table">
        <tbody>
          <tr>
            <th scope="row">ID</th>
            <td>{task.taskId}</td>
          </tr>
          <tr>
            <th scope="row">Updated</th>
            <td>{task.timestamp}</td>
          </tr>
          <tr>
            <th scope="row">Title</th>
            <td>{task.title}</td>
          </tr>
          <tr>
            <th scope="row">Description</th>
            <td><pre>{task.description}</pre></td>
          </tr>
          <tr>
            <th scope="row"></th>
            <td><input type="checkbox" name="done" {#if task.done}checked{/if} disabled> Done</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
